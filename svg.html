<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pikachu SVG</title>
</head>
<body>

<svg width="400" height="400" viewBox="0 0 400 400">

    <!-- Ears -->
    <polygon points="120,70 90,10 140,50" fill="#FFD93B" stroke="black" stroke-width="3"/>
    <polygon points="280,70 310,10 260,50" fill="#FFD93B" stroke="black" stroke-width="3"/>

    <!-- Ear tips -->
    <polygon points="90,10 105,35 120,20" fill="black"/>
    <polygon points="310,10 295,35 280,20" fill="black"/>

    <!-- Head -->
    <circle cx="200" cy="180" r="120" fill="#FFD93B" stroke="black" stroke-width="3"/>

    <!-- Eyes -->
    <circle cx="155" cy="155" r="15" fill="black"/>
    <circle cx="245" cy="155" r="15" fill="black"/>

    <!-- Eye highlights -->
    <circle cx="150" cy="150" r="5" fill="white"/>
    <circle cx="240" cy="150" r="5" fill="white"/>

    <!-- Nose -->
    <polygon points="195,185 205,185 200,193" fill="black"/>

    <!-- Mouth -->
    <path d="M200 193 Q185 210 170 205" fill="none" stroke="black" stroke-width="3"/>
    <path d="M200 193 Q215 210 230 205" fill="none" stroke="black" stroke-width="3"/>

    <!-- Cheeks -->
    <circle cx="110" cy="210" r="25" fill="#FF4D4D"/>
    <circle cx="290" cy="210" r="25" fill="#FF4D4D"/>

</svg>

</body>
</html>
